[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-kernel-builder"
version = "0.1.0"
description = "Analyze source code and build a minimal-attack-surface Linux kernel config for exactly what it uses."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "주인롭" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["llama-cpp-python>=0.2"]

[project.scripts]
magi = "magi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
